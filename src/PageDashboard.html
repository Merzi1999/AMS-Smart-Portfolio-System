  <!-- Inline Script for Dashboard Specific UI Logic (Time & Greeting) -->
  <script>
    (function() {
      // 1. Update Date
      const dateEl = document.getElementById('dash-date');
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      if(dateEl) dateEl.innerText = now.toLocaleDateString('th-TH', options);

      // 2. Update Greeting based on Time
      const greetEl = document.getElementById('dash-greeting');
      const hour = now.getHours();
      let greeting = "สวัสดี";
      if (hour >= 5 && hour < 12) greeting = "สวัสดีตอนเช้า";
      else if (hour >= 12 && hour < 17) greeting = "สวัสดีตอนบ่าย";
      else if (hour >= 17 && hour < 21) greeting = "สวัสดีตอนเย็น";
      else greeting = "ราตรีสวัสดิ์";
      
      if(greetEl) greetEl.innerText = greeting;

      // 3. User name will be updated by script.html's logic
    })();
  </script>
